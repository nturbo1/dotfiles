# Use Ctrl + a instead of the default Ctrl + b
set-option -g prefix C-a
unbind C-b
bind C-a send-prefix

# Pane movement
bind -n M-h select-pane -L  # Alt + h → Left
bind -n M-j select-pane -D  # Alt + j → Down
bind -n M-k select-pane -U  # Alt + k → Up
bind -n M-l select-pane -R  # Alt + l → Right

# Split windows using Vim-style shortcuts
bind | split-window -h
bind - split-window -v

# Switch windows with Alt + [number]
set-option -g base-index 1
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Resize panes
bind -n C-Left  resize-pane -L 5
bind -n C-Down  resize-pane -D 5
bind -n C-Up    resize-pane -U 5
bind -n C-Right resize-pane -R 5

# Reload tmux config easily with Ctrl + a + r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Enable mouse support
set-option -g mouse on

# Use vi style copy mode
setw -g mode-keys vi

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in" # Entering y yanks (copying in Vi/Vim terms) and sends it to the system clipboard

# For Fedora on GNOME (uses Wayland)
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# Alt+, → next window (like :bnext in Vim)
bind -n M-, previous-window

# Alt+. → previous window (like :bprev in Vim)
bind -n M-. next-window

bind -n M-Tab last-window   # Alt+Tab toggles between last two windows

bind v copy-mode

# Move down by a screen height using Shift-j
bind-key -T copy-mode-vi J send-keys -X page-down

# Move up by a screen height using Shift-k
bind-key -T copy-mode-vi K send-keys -X page-up
